<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Secure Checkout | Bookstream</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/rem.png') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root { --navy: #011627; --gold: #d4af37; --cream: #fcfbf7; }
        body { background-color: var(--cream); font-family: 'Plus Jakarta Sans', sans-serif; }
        .payment-card { 
            background: white; border-radius: 20px; padding: 40px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.05); margin-top: 50px; 
        }
        .method-box {
            border: 2px solid #eee; border-radius: 12px; padding: 20px;
            cursor: pointer; transition: 0.3s; margin-bottom: 15px;
        }
        .method-box:hover, .method-box.active { border-color: var(--gold); background: #fffdf5; }
        .btn-pay { background: var(--navy); color: white; border-radius: 50px; width: 100%; padding: 15px; font-weight: bold; border: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="payment-card">
                    <h2 class="fw-bold mb-4 text-center">Oxford Secure Pay</h2>
                    <form action="{{ url_for('checkout') }}" method="POST">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        
                        <p class="text-muted small text-uppercase fw-bold mb-3">Select Payment Method</p>
                        
                        <label class="w-100">
                            <input type="radio" name="payment_method" value="Cash" class="d-none" checked>
                            <div class="method-box active d-flex align-items-center">
                                <i class="bi bi-truck fs-3 me-3 text-primary"></i>
                                <div>
                                    <h6 class="mb-0 fw-bold">Cash on Delivery</h6>
                                    <small class="text-muted">Pay when you receive the book</small>
                                </div>
                            </div>
                        </label>

                        <label class="w-100 opacity-50">
                            <input type="radio" name="payment_method" value="E-Sewa" class="d-none" disabled>
                            <div class="method-box d-flex align-items-center">
                                <i class="bi bi-wallet2 fs-3 me-3 text-success"></i>
                                <div>
                                    <h6 class="mb-0 fw-bold">Digital Wallet (Coming Soon)</h6>
                                    <small class="text-muted">eSewa / Khalti integration</small>
                                </div>
                            </div>
                        </label>

                        <button type="submit" class="btn-pay mt-4 shadow-lg">
                            COMPLETE TRANSACTION <i class="bi bi-shield-lock-fill ms-2"></i>
                        </button>
                    </form>
                    <div class="text-center mt-4">
                        <a href="{{ url_for('view_cart') }}" class="text-decoration-none text-muted small">Cancel and return to cart</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
